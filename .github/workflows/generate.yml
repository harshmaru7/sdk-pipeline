name: generate-sdk

# Reusable workflow. Each SDK repo (godo-next / pydo-next / dots-next) calls
# this with its language. Spec is pulled from harshmaru7/openapi-sdk @ sha.
on:
  workflow_call:
    inputs:
      language:
        description: "fern generator group: go | python | typescript"
        required: true
        type: string
      spec_sha:
        description: "openapi-sdk commit SHA to generate from"
        required: true
        type: string
      spec_path:
        description: "path inside openapi-sdk to the OpenAPI document"
        required: false
        type: string
        default: "specification/DigitalOcean-public.v2.yaml"
    secrets:
      sdk_bot_pat:
        description: "PAT with repo scope on the SDK repo + read on openapi-sdk + sdk-generator"
        required: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: checkout SDK repo (caller)
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.sdk_bot_pat }}

      - name: checkout sdk-generator (fern config)
        uses: actions/checkout@v4
        with:
          repository: harshmaru7/sdk-pipeline
          path: .sdk-generator
          token: ${{ secrets.sdk_bot_pat }}

      - name: checkout openapi-sdk @ ${{ inputs.spec_sha }}
        uses: actions/checkout@v4
        with:
          repository: harshmaru7/openapi-sdk
          ref: ${{ inputs.spec_sha }}
          path: .spec
          token: ${{ secrets.sdk_bot_pat }}

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: install fern CLI
        run: npm install -g fern-api@5.38.1

      - name: scaffold fern workspace
        run: |
          set -euxo pipefail
          mkdir -p .work/fern
          cp .sdk-generator/fern/fern.config.json .work/fern/
          cp .sdk-generator/fern/generators.yml .work/fern/
          if [ ! -f ".spec/${{ inputs.spec_path }}" ]; then
            echo "spec not found at .spec/${{ inputs.spec_path }}"
            ls -la .spec/
            exit 1
          fi
          # Bundle the spec via redocly: external file $refs get hoisted
          # into #/components/{schemas,responses,headers,...}; everything
          # downstream uses standard OpenAPI #/components/... refs that
          # Fern resolves correctly. Without this, Fern reads the entry
          # file but silently emits untyped response bodies for any
          # operation whose response/model lives in another file.
          npx -y @redocly/cli@1.25.13 bundle \
            ".spec/${{ inputs.spec_path }}" \
            --output .work/openapi.yaml \
            --ext yaml
          echo "bundle size: $(wc -c < .work/openapi.yaml) bytes"

          # Strip operations whose inline type names collide in Fern's
          # global type table (e.g. `ActionStatus` declared both at the
          # root and inside reservedIPv6Actions). This is a POC-level
          # workaround — the proper fix is x-fern-type-name overrides
          # on the conflicting types in the upstream spec, but that
          # requires per-endpoint tagging we'll do post-POC.
          NPM_GLOBAL=$(npm root -g)
          npm install --prefix /tmp/postproc js-yaml@4.1.0 >/dev/null
          NODE_PATH=/tmp/postproc/node_modules node -e "
            const yaml = require('js-yaml');
            const fs = require('fs');
            const d = yaml.load(fs.readFileSync('.work/openapi.yaml', 'utf8'));

            // 1. Drop paths whose inline type names collide in Fern's
            //    flat type table (proper fix: x-fern-type-name overrides).
            const drop = ['/v2/reserved_ipv6/{reserved_ipv6}/actions'];
            for (const p of drop) {
              if (d.paths && d.paths[p]) { delete d.paths[p]; console.log('dropped path:', p); }
            }

            // 2. Clamp any numeric value > MaxInt32 — Fern's Go generator
            //    unmarshals literal numbers (defaults, examples, enum values,
            //    etc.) into Go int and crashes on anything that overflows.
            //    The DO spec has MaxInt64 sprinkled in kafka defaults AND
            //    inside example response payloads.
            const MAX = 2147483647;
            let clamped = 0;
            (function walk(node) {
              if (node === null || typeof node !== 'object') return;
              if (Array.isArray(node)) {
                for (let i = 0; i < node.length; i++) {
                  if (typeof node[i] === 'number' && Math.abs(node[i]) > MAX) {
                    node[i] = node[i] > 0 ? MAX : -MAX;
                    clamped++;
                  } else {
                    walk(node[i]);
                  }
                }
                return;
              }
              for (const k of Object.keys(node)) {
                const v = node[k];
                if (typeof v === 'number' && Math.abs(v) > MAX) {
                  node[k] = v > 0 ? MAX : -MAX;
                  clamped++;
                } else {
                  walk(v);
                }
              }
            })(d);
            console.log('clamped numeric values > MaxInt32:', clamped);

            fs.writeFileSync('.work/openapi.yaml', yaml.dump(d, { lineWidth: -1, noRefs: true }));
          "

      - name: fern generate --local --group ${{ inputs.language }}
        working-directory: .work/fern
        run: fern generate --local --group ${{ inputs.language }}

      - name: locate fern output
        id: locate
        run: |
          set -euxo pipefail
          if [ -d ".work/output" ] && [ -n "$(ls -A .work/output 2>/dev/null)" ]; then
            echo "dir=.work/output" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # fallback: some Fern versions stage to .fern-tmp/<run>/output
          staged=$(find .work -type d -path '*/.fern-tmp/*/output' | head -n1 || true)
          if [ -n "$staged" ]; then
            echo "dir=$staged" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "no fern output produced"
          exit 1

      - name: sync generated files into repo root
        run: |
          set -euxo pipefail
          rsync -av --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.sdk-generator/' \
            --exclude='.spec/' \
            --exclude='.work/' \
            --exclude='README.md' \
            --exclude='LICENSE' \
            --exclude='.gitignore' \
            "${{ steps.locate.outputs.dir }}/" ./

      - name: drop staging dirs so they don't leak into the PR
        run: rm -rf .work .sdk-generator .spec

      - name: stamp generation metadata
        run: |
          cat > .sdk-meta.json <<EOF
          {
            "language": "${{ inputs.language }}",
            "spec_repo": "harshmaru7/openapi-sdk",
            "spec_sha": "${{ inputs.spec_sha }}",
            "generated_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "generator_workflow_run": "${{ github.run_id }}"
          }
          EOF

      - name: open PR
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.sdk_bot_pat }}
          branch: auto/spec-${{ inputs.spec_sha }}
          commit-message: "regen: ${{ inputs.language }} sdk @ openapi-sdk ${{ inputs.spec_sha }}"
          title: "regen: ${{ inputs.language }} sdk @ openapi-sdk ${{ inputs.spec_sha }}"
          body: |
            Auto-regenerated by `harshmaru7/sdk-pipeline`.

            - **language**: `${{ inputs.language }}`
            - **spec**: [`harshmaru7/openapi-sdk@${{ inputs.spec_sha }}`](https://github.com/harshmaru7/openapi-sdk/commit/${{ inputs.spec_sha }})
            - **generator run**: [#${{ github.run_id }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})

            Generated with Fern. Do not hand-edit files in this PR — edit the
            spec in `openapi-sdk` or the generator config in `sdk-generator`
            and rerun.
          delete-branch: true
          committer: "do-sdk-bot <do-sdk-bot@users.noreply.github.com>"
          author: "do-sdk-bot <do-sdk-bot@users.noreply.github.com>"
